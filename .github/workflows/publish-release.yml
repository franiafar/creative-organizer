name: Publish Creative Organizer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest

    steps:
      - name: Check out the release version
        uses: actions/checkout@v4

      - name: Package the application
        run: |
          ditto -c -k --sequesterRsrc --keepParent "Creative Organizer.app" Creative-Organizer.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Creative-Organizer.zip \
            --title "Creative Organizer $GITHUB_REF_NAME" \
            --notes "Descarga Creative-Organizer.zip, descomprimelo y abre la aplicacion."
